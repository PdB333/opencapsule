name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test -count=1 ./...
  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build windows/amd64
        run: go build -trimpath -buildvcs=false -ldflags="-s -w" -o opencapsule.exe ./cmd/opencapsule
      - uses: actions/upload-artifact@v4
        with:
          name: opencapsule-windows-amd64-preview
          path: opencapsule.exe
          if-no-files-found: error
